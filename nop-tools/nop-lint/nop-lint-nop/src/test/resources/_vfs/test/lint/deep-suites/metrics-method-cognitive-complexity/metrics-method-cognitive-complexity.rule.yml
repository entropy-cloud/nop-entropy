# roadmap item 35 (plan 2026-09-24-1400-1 enum #12): deep-suite rule copy of
# the production cognitive-complexity rule (see the cyclomatic suite header
# for the independent-copy shape).
id: quality/method-cognitive-complexity
language: Java
severity: warning
message: "方法认知复杂度过高 (method cognitive complexity exceeds 15)"
requires: METRICS
rule:
  kind: method_declaration
# the 100ms default deadline is a real-clock budget: a loaded CI machine can
# stall a match past it and drop the report; declare the parser maximum instead
xscriptTimeoutMs: 1000
xscript: |
  let c = metrics.cognitive(node);
  if (c > 15) {
    report({ message: '方法认知复杂度过高：cognitive=' + c + ' > 15 (method cognitive complexity ' + c + ' exceeds 15)' });
  }
metadata:
  category: quality
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/nop-lint/2026-09-24-1400-1-rule-library-48.md enum #12 (design 06 §4.1 CognitiveComplexity)"
