# xdsl-full-coverage roadmap WI2 (plan 2348) — R8 narrowed L1 sub-face.
# Roadmap R8's full signal (fingerprint/topology similarity against the
# parent model) is a cross-file face; the single-file decidable sub-face is
# "a derived model must not rewrite the parent topology wholesale" — in XLang
# delta semantics that shows up as <transforms x:override="replace"> in a
# model carrying x:extends. Repository delta idiom is x:extends + per-id
# patching (zero x:override precedent), so baseline is 0.
id: nop-xdsl-delta-derivation
language: XML
severity: warning
message: "派生模型整体重写父拓扑：<transforms x:override=\"replace\"> 违反 Delta 化约定 (derived model rewrites the parent topology wholesale via transforms x:override=replace)"
rule:
  pattern: "<transforms/>"
xscript: |
  if (node.attrValue('x:override') != 'replace') {
    return;
  }
  let root = node.ancestor('stream');
  if (root == null) {
    return;
  }
  let base = root.attrValue('x:extends');
  if (base == null || base == '') {
    return;
  }
  report({ message: 'x:extends 派生模型以 x:override="replace" 整体重写 <transforms>——应按 id 增量覆写 (derived model replaces the whole transforms block; patch per id instead)' });
metadata:
  category: nop
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/2348-wi2-xdsl-lint-l1-rules.md (xdsl roadmap WI2, R8 narrowed L1 face)"
