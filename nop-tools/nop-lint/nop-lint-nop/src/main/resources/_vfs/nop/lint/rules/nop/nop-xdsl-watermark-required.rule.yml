# xdsl-full-coverage roadmap WI2 (plan 2348) — R5 L1 static face.
# A stream model that declares <window> or <cep> but has no
# <timestampsAndWatermarks> node anywhere relies on ambient watermarks that
# the XDSL face never supplies (the builder only wires watermarks through the
# timestampsAndWatermarks transform). Same semantic anchor as roadmap R5;
# the model-aware half is WI3. Counting: one diagnostic per window/cep hit
# (current corpus: test-param-agg.stream.xml, 1 node). Release duty: when the
# roadmap WI surfaces change this face, retire the corresponding branch here
# and in the ledger matrix (release three-step).
# Scope guard: xscript has no parent() — ancestor('stream') is the only root
# guard (pattern <window/> also matches any deeper window element, but a
# non-stream model has no stream ancestor at any depth).
id: nop-xdsl-watermark-required
language: XML
severity: warning
message: "stream 模型使用 <window>/<cep> 但未声明 <timestampsAndWatermarks> 水位供给 (stream model uses <window>/<cep> without a <timestampsAndWatermarks> node)"
rule:
  any:
    - pattern: "<window/>"
    - pattern: "<cep/>"
xscript: |
  let root = node.ancestor('stream');
  if (root == null) {
    return;
  }
  if (root.descendant('timestampsAndWatermarks') != null) {
    return;
  }
  report({ message: '<' + node.kind() + '> 所在模型缺少 <timestampsAndWatermarks> 水位供给声明 (model declares window/cep without timestampsAndWatermarks)' });
metadata:
  category: nop
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/2348-wi2-xdsl-lint-l1-rules.md (xdsl roadmap WI2, R5 L1 face)"
