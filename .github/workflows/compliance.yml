# Lightweight compliance gates that do not require a full Maven build.
# The bean-naming job uses a trimmed node-only REF-face scanner plus a
# nop-lint CLI step (JDK required, compile-only — no test execution).
# These run fast and fail early on convention violations.

name: Compliance

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  bean-naming:
    name: Bean naming convention (nop prefix)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # REF cross-file reference face (node-only, trimmed scanner)
      - name: Check bean REF cross-file references
        run: node ai-dev/tools/check-bean-naming.mjs
      # BEAN-ID / COLLECT-PREFIX face (nop-lint rule nop-bean-naming, error)
      # tool-replacement roadmap item 5, plan nop-lint/21 + 28
      - name: Compile nop-lint modules
        run: mvn -q -pl nop-tools/nop-lint/nop-lint-core,nop-tools/nop-lint/nop-lint-java,nop-tools/nop-lint/nop-lint-nop -DskipTests compile
      - name: Build nop-lint classpath
        run: mvn -q -pl nop-tools/nop-lint/nop-lint-nop dependency:build-classpath -Dmdep.outputFile=/tmp/nop-lint-cp.txt
      - name: Check bean id naming (nop-lint nop-bean-naming)
        run: |-
          CP="nop-tools/nop-lint/nop-lint-core/target/classes:nop-tools/nop-lint/nop-lint-java/target/classes:nop-tools/nop-lint/nop-lint-nop/target/classes:$(cat /tmp/nop-lint-cp.txt)"
          FILES=$(find . -name "*.beans.xml" \
            -not -path "*/target/*" -not -path "*/_gen/*" -not -path "*/_tmp/*" \
            -not -path "*/src/test/*" -not -path "*nop-demo*" \
            -not -path "*/node_modules/*" \
            -not -path "*/docs/*" -not -path "*/docs-en/*")
          java -cp "$CP" io.nop.lint.core.cli.NopLintCli check \
            $FILES --rules nop-bean-naming --max-warnings 0

  # test-timing-determinism roadmap WI3 (plan 2509): the sleep-face time-wait
  # inventory over src/test java is enforced against the committed baseline
  # (ai-dev/tools/test-time-waits-baseline.json). 只减不增 semantics: a NEW time-wait
  # (or any count increase) exits 1; a fix without a same-change `--update` baseline
  # prune also exits 1 (stale entries). Positive control runs first so a scanner
  # that silently stopped detecting fails the job instead of passing vacuously.
  test-time-waits:
    name: Test-source time-wait guard (baseline 只减不增)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard self-test (scanner must prove it can go red)
        run: node ai-dev/tools/check-test-time-waits.mjs self-test
      - name: Time-wait baseline check (exit 0 required)
        run: node ai-dev/tools/check-test-time-waits.mjs

  message-silent-wrong-result:
    name: Message silent-wrong-result rules (nop-message)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # WI18: message-domain rule families (msg-pre-poll-seek / msg-stub /
      # msg-warn-per-call) — positive/negative self-test first, then the module scan.
      - name: Fixture self-test (all rules, both directions)
        run: node ai-dev/tools/check-silent-wrong-result.mjs --fixture
      - name: Scan nop-message (exit 0 required)
        run: node ai-dev/tools/check-silent-wrong-result.mjs --module nop-message

  # nop-stream structure-refactor roadmap WI12 (plan 2436): the three structural
  # invariants become blocking CI checks. Positive control runs first so a
  # scanner that silently stopped rejecting bad input fails the job instead of
  # passing vacuously.
  #   core-no-runtime-dep:        WI3 (comment face) + WI7 (reflection face) stay at zero
  #   runtime-package-acyclicity: WI6 four-package cycles stay broken
  #   connector-test-fan-in:      WI5 disposition (b) — every connector test dep
  #                               keeps a live consumer; unregistered deps fail
  nop-stream-structure:
    name: nop-stream structure gates (core→runtime dep / package cycles / connector fan-in)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Structure gate self-test (scanners must prove they can go red)
        run: node ai-dev/tools/check-nop-stream-structure.mjs self-test
      - name: nop-stream structure gates (exit 0 required)
        run: node ai-dev/tools/check-nop-stream-structure.mjs

  xdsl-lint:
    name: XDSL best-practice lint (nop-xdsl-* rules, baseline 只减不增)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # xdsl-full-coverage roadmap WI4 (plan 2350): the L1 static rule set over the
      # nop-stream .stream.xml corpus (38 files, including the _delta layer; the
      # nop-lint rule-suite fixtures are excluded — they carry their own
      # TestNopRuleSuites gate). Warnings are captured by the committed baseline:
      # --baseline-check suppresses the registered stock and enforces 只减不增
      # (a NEW violation or an unregenerated fix both exit 1); --max-warnings 0 is
      # load-bearing for warning-severity rules (baseline-check alone would let
      # fresh warnings through the severity count). 消号 = fix + regenerate the
      # baseline in the SAME change (stale entries fail the check).
      - name: Compile nop-lint modules
        run: mvn -q -pl nop-tools/nop-lint/nop-lint-core,nop-tools/nop-lint/nop-lint-nop -DskipTests compile
      - name: Build nop-lint classpath
        run: mvn -q -pl nop-tools/nop-lint/nop-lint-nop dependency:build-classpath -Dmdep.outputFile=/tmp/nop-lint-cp.txt
      - name: Check XDSL declaration-face best practices (nop-xdsl-*)
        run: |-
          CP="nop-tools/nop-lint/nop-lint-core/target/classes:nop-tools/nop-lint/nop-lint-nop/target/classes:$(cat /tmp/nop-lint-cp.txt)"
          FILES=$(find nop-stream -name "*.stream.xml" -not -path "*/target/*" | sort)
          java -cp "$CP" io.nop.lint.core.cli.NopLintCli check \
            $FILES \
            --rules nop-xdsl-watermark-required,nop-xdsl-credential-plaintext,nop-xdsl-delta-derivation,nop-xdsl-edge-partition,nop-xdsl-transform-naming,nop-xdsl-undeclared-consumer \
            --baseline-check ai-dev/tools/nop-lint-xdsl-baseline.txt --max-warnings 0

  # WI27 (plan 2373): the 12-scenario acceptance suites + the four release-face
  # regression pins run as a blocking CI gate. These tests execute the full
  # XDSL chain (fixture → DslModelParser → StreamModelDslBuilder → env.execute)
  # so any release-face regression (registry families / lifecycle callbacks /
  # edge flow-control / endpoint attributes) or scenario data-plane breakage
  # blocks the merge.
  xdsl-scenarios:
    name: XDSL acceptance scenarios (E1-E12) + release-face pins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build flow + sql + runtime modules
        run: mvn -q -pl nop-stream/nop-stream-flow,nop-stream/nop-stream-sql,nop-stream/nop-stream-runtime -am -DskipTests install
      - name: Run 12-scenario acceptance suites (E1-E12) + deferred-unlock declaration E2Es
        run: |-
          mvn -pl nop-stream/nop-stream-runtime test -Dtest='TestXdslScenarioE1,TestXdslScenarioE2,TestXdslScenarioE3,TestXdslScenarioE4,TestXdslScenarioE5,TestXdslScenarioE6,TestXdslScenarioE7,TestXdslScenarioE8,TestXdslScenarioE9,TestXdslScenarioE10,TestXdslScenarioE11,TestXdslScenarioE12,TestSourceRateLimitE2E,TestSourceTableIdE2E' -DfailIfNoTests=true
      - name: Run release-face regression pins (WI12/WI13/WI14/WI15) + deferred-unlock declaration pins
        run: |-
          mvn -pl nop-stream/nop-stream-flow test -Dtest='TestWi12RegistryFamilies,TestStreamModelDslBuilderFailFast,TestStreamModelEdgeContract,TestWi15EndpointAttributes,TestSourceRateLimitDeclaration,TestSourceTableIdDeclaration' -DfailIfNoTests=true
      - name: Run deferred-unlock core stamping pins (U3 rate-limit wrapper / U4 tableId stamping / WI7 bridge)
        run: |-
          mvn -pl nop-stream/nop-stream-core test -Dtest='TestRateLimitedSourceFunction,TestDeclaredTableIdStamping,TestChangeMetadataBridgeAndGuard' -DfailIfNoTests=true
      - name: Run deferred-unlock U2 transform-SQL fragment pins
        run: |-
          mvn -pl nop-stream/nop-stream-sql test -Dtest='TestSqlTransformFragmentCompile,TestSqlTransformE2E' -DfailIfNoTests=true
