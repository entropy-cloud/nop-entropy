# Lightweight compliance gates that do not require a full Maven build.
# The bean-naming job uses a trimmed node-only REF-face scanner plus a
# nop-lint CLI step (JDK required, compile-only — no test execution).
# These run fast and fail early on convention violations.

name: Compliance

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  bean-naming:
    name: Bean naming convention (nop prefix)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # REF cross-file reference face (node-only, trimmed scanner)
      - name: Check bean REF cross-file references
        run: node ai-dev/tools/check-bean-naming.mjs
      # BEAN-ID / COLLECT-PREFIX face (nop-lint rule nop-bean-naming, error)
      # tool-replacement roadmap item 5, plan nop-lint/21 + 28
      - name: Compile nop-lint modules
        run: mvn -q -pl nop-lint/nop-lint-core,nop-lint/nop-lint-java,nop-lint/nop-lint-nop -DskipTests compile
      - name: Build nop-lint classpath
        run: mvn -q -pl nop-lint/nop-lint-nop dependency:build-classpath -Dmdep.outputFile=/tmp/nop-lint-cp.txt
      - name: Check bean id naming (nop-lint nop-bean-naming)
        run: |-
          CP="nop-lint/nop-lint-core/target/classes:nop-lint/nop-lint-java/target/classes:nop-lint/nop-lint-nop/target/classes:$(cat /tmp/nop-lint-cp.txt)"
          FILES=$(find . -name "*.beans.xml" \
            -not -path "*/target/*" -not -path "*/_gen/*" -not -path "*/_tmp/*" \
            -not -path "*/src/test/*" -not -path "*nop-demo*" \
            -not -path "*/node_modules/*" \
            -not -path "*/docs/*" -not -path "*/docs-en/*")
          java -cp "$CP" io.nop.lint.core.cli.NopLintCli check \
            $FILES --rules nop-bean-naming --max-warnings 0

  message-silent-wrong-result:
    name: Message silent-wrong-result rules (nop-message)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # WI18: message-domain rule families (msg-pre-poll-seek / msg-stub /
      # msg-warn-per-call) — positive/negative self-test first, then the module scan.
      - name: Fixture self-test (all rules, both directions)
        run: node ai-dev/tools/check-silent-wrong-result.mjs --fixture
      - name: Scan nop-message (exit 0 required)
        run: node ai-dev/tools/check-silent-wrong-result.mjs --module nop-message

  xdsl-lint:
    name: XDSL best-practice lint (nop-xdsl-* rules, baseline 只减不增)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # xdsl-full-coverage roadmap WI4 (plan 2350): the L1 static rule set over the
      # nop-stream .stream.xml corpus (38 files, including the _delta layer; the
      # nop-lint rule-suite fixtures are excluded — they carry their own
      # TestNopRuleSuites gate). Warnings are captured by the committed baseline:
      # --baseline-check suppresses the registered stock and enforces 只减不增
      # (a NEW violation or an unregenerated fix both exit 1); --max-warnings 0 is
      # load-bearing for warning-severity rules (baseline-check alone would let
      # fresh warnings through the severity count). 消号 = fix + regenerate the
      # baseline in the SAME change (stale entries fail the check).
      - name: Compile nop-lint modules
        run: mvn -q -pl nop-lint/nop-lint-core,nop-lint/nop-lint-nop -DskipTests compile
      - name: Build nop-lint classpath
        run: mvn -q -pl nop-lint/nop-lint-nop dependency:build-classpath -Dmdep.outputFile=/tmp/nop-lint-cp.txt
      - name: Check XDSL declaration-face best practices (nop-xdsl-*)
        run: |-
          CP="nop-lint/nop-lint-core/target/classes:nop-lint/nop-lint-nop/target/classes:$(cat /tmp/nop-lint-cp.txt)"
          FILES=$(find nop-stream -name "*.stream.xml" -not -path "*/target/*" | sort)
          java -cp "$CP" io.nop.lint.core.cli.NopLintCli check \
            $FILES \
            --rules nop-xdsl-watermark-required,nop-xdsl-credential-plaintext,nop-xdsl-delta-derivation,nop-xdsl-edge-partition,nop-xdsl-transform-naming,nop-xdsl-undeclared-consumer \
            --baseline-check ai-dev/tools/nop-lint-xdsl-baseline.txt --max-warnings 0
