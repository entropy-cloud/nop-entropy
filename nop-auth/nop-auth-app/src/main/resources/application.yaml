nop:
  auth:
    sso:
      enabled: false
      server-url: http://localhost:8041
      realm: app
      client-id: test-client
      client-secret: qpgEjwXqd1TpgaA3aIi1jd4AVTLCrs8o
    site-map:
      static-config-path: /nop/auth/auth/app.action-auth.xml
      cache-timeout: 1s
      support-debug: true

    login:
      allow-create-default-user: true # 如果用户表为空，则自动创建缺省账户nop, 密码nop-test
      allow-multiple-sessions-same-user: true # e2e：浏览器会话与 RPC 请求上下文各自登录，单会话策略会互踢 # 如果用户表为空，则自动创建缺省账户nop, 密码nop-test

    web:
      validate-page-model: true

    jwt:
      enc-key: dij3)(4ldt[]erq=2mfKID

  orm:
    init-database-schema: true

  datasource:
    #    driver-class-name: org.h2.Driver
    #    jdbc-url: jdbc:h2:./db/test
    #    username: sa
    #    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    jdbc-url: jdbc:mysql://127.0.0.1:3306/dev?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=UTC
    username: nop
    password: nop-test


# 开发模式配置
"%dev":
  nop:
    debug: true
    # e2e/演示：文件上传落盘目录（缺省 /nop/file 为文件系统根路径，不可写）
    file:
      store-dir: ./target/file-store
    auth:
      login:
        allow-create-default-user: true # 如果用户表为空，则自动创建缺省账户nop, 密码123
    datasource:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:test
      username: sa
      password:

    web:
      validate-page-model: true

    orm:
      init-database-schema: true

    # 支持graphql __schema查询，
    graphql:
      schema-introspection:
        enabled: true

# devservices 会启用testcontainers来管理测试数据库
quarkus:
  dev:
    watch:
      enabled: false

  live-reload:
    enabled: false

  devservices:
    enabled: false


  smallrye-graphql:
    ui:
      always-include: true

  http:
    cors: true

  log:
    level: INFO
