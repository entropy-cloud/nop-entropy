# roadmap item 35 (plan 2026-09-24-1400-1 enum #13): deep-suite rule copy of
# the production npath-complexity rule (see the cyclomatic suite header for
# the independent-copy shape). The invalid fixture's eight serial ifs give
# 2^8 = 256 paths — the plan's R1-核验 construction.
id: quality/method-npath-complexity
language: Java
severity: warning
message: "方法 NPath 路径复杂度过高 (method NPath complexity exceeds 200)"
requires: METRICS
rule:
  kind: method_declaration
xscript: |
  let n = metrics.npath(node);
  if (n > 200) {
    report({ message: '方法 NPath 路径复杂度过高：npath=' + n + ' > 200 (method NPath complexity ' + n + ' exceeds 200)' });
  }
metadata:
  category: quality
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/nop-lint/2026-09-24-1400-1-rule-library-48.md enum #13 (design 06 §4.1 NPathComplexity)"
