# roadmap item 35 (plan 2026-09-24-1400-1 enum #11): deep-suite rule copy —
# production deep rules land as main resources under /nop/lint/rules/ (the
# count gate pins them there); the deep suite carries the independent full
# rule (the items 32 demo-suite shape: no x:extends pointer, so the suite
# proves the rule body itself under the DEEP profile with the metrics
# provider wired explicitly).
id: quality/method-cyclomatic-complexity
language: Java
severity: warning
message: "方法圈复杂度过高 (method cyclomatic complexity exceeds 10)"
requires: METRICS
rule:
  kind: method_declaration
xscript: |
  let c = metrics.cyclomatic(node);
  if (c > 10) {
    report({ message: '方法圈复杂度过高：cyclomatic=' + c + ' > 10 (method cyclomatic complexity ' + c + ' exceeds 10)' });
  }
metadata:
  category: quality
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/nop-lint/2026-09-24-1400-1-rule-library-48.md enum #11 (design 06 §4.1 CyclomaticComplexity)"
