# roadmap item 35 (plan 2026-09-24-1400-1 enum #14): deep-suite rule copy of
# the production unused-local-variable rule (independent full rule, the
# items 34 demo-suite shape; the L3 provider is wired explicitly by the
# family launcher).
id: quality/unused-local-variable
language: Java
severity: warning
message: "未使用的局部变量 (unused local variable)"
requires: L3
rule:
  kind: variable_declarator
xscript: |
  if (node.ancestor('method_declaration') == null) {
    return;
  }
  if (dataflow.useCount(node) == 0) {
    report({ message: '未使用的局部变量 (unused local variable): ' + node.child('name').text() });
  }
metadata:
  category: quality
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/nop-lint/2026-09-24-1400-1-rule-library-48.md enum #14"
