# roadmap item 36 (plan 2026-09-24-2300-1 enum #11, manifest credit
# PMD:BigIntegerInstantiation): BigInteger caches ZERO/ONE/TEN —
# constructing them allocates needlessly; valueOf returns the shared
# instance. The inList pins the QUOTED literal forms (capture text includes
# the quotes, no-md5-digest precedent); other constants and variable keys
# stay unflagged.
id: quality/biginteger-instantiation
language: Java
severity: warning
message: "用 BigInteger.ZERO/ONE/TEN 或 valueOf (use the cached constant or valueOf)"
rule:
  pattern: "new BigInteger($LIT)"
constraints:
  - inList:
      capture: LIT
      values: ['"0"', '"1"', '"10"']
metadata:
  category: quality
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/nop-lint/2026-09-24-2300-1-pmd-ep-p0p1-batch.md enum #11 (PMD:BigIntegerInstantiation)"
