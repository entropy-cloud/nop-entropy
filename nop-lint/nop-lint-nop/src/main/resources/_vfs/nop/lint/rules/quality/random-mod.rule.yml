# roadmap item 36 (plan 2026-09-24-2300-1 enum #8, manifest credit
# EP:RandomModInteger): nextInt() % n is biased unless n divides 2^32 —
# Random.nextInt(n) draws uniformly. Receiver adjudication (plan enum #8
# spike): the receiver name regex pins the Random-shaped receivers
# (random/rnd, case-insensitive, full-match — the query-limit-required $Q
# identifier-regex precedent); an arbitrary receiver named nextInt-carrier
# stays out of the v1 face and the over-face is recorded here rather than
# silently taken.
id: quality/random-mod
language: Java
severity: warning
message: "nextInt() % n 分布有偏，请用 nextInt(n) (modulo of nextInt() is biased; use nextInt(n))"
rule:
  pattern: "$R.nextInt() % $N"
constraints:
  - regex:
      capture: R
      pattern: '(?i)(random|rnd)'
metadata:
  category: quality
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/nop-lint/2026-09-24-2300-1-pmd-ep-p0p1-batch.md enum #8 (EP:RandomModInteger)"
