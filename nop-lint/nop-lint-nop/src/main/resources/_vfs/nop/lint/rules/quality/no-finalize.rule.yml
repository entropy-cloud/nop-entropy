# roadmap item 35 (plan 2026-09-24-1400-1 enum #24, R1 F4 候选池替换裁定):
# overriding finalize is deprecated (JEP 421), unreliable (no promptness or
# execution guarantee) and a GC-resurrection hazard. The landed form is the
# kind+xscript name judgment — the plan's original #24 (string == /
# sameText family) was revoked for false-positive blast radius and replaced
# by this candidate-pool rule. v1 scope: every method NAMED finalize (the
# arity check is deliberately not applied — a `finalize(int)` overload is
# itself a trap worth flagging).
id: quality/no-finalize
language: Java
severity: warning
message: "禁止覆写 finalize (Do not override finalize; deprecated, unreliable and a resurrection hazard)"
rule:
  kind: method_declaration
xscript: |
  let name = node.child('name');
  if (name == null || name.text() != 'finalize') {
    return;
  }
  report({ message: '覆写 finalize：已废弃且不可靠 (overriding finalize)' });
metadata:
  category: quality
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/nop-lint/2026-09-24-1400-1-rule-library-48.md enum #24 (design 06 §4.1, JEP 421)"
