# roadmap item 36 (plan 2026-09-24-2300-1 enum #10, manifest credit
# PMD:StringInstantiation — R1 #1 narrowed form): `new String()` and
# `new String("literal")` never need the copy (the literal is already a
# String; interned copies waste memory), but the byte[]/char[]/charset
# conversion forms are legitimate decoding calls and MUST stay unflagged —
# hence the xscript face check rather than a blanket new-String pattern.
# Sequence captures reach xscript as ordered lists (XScriptEngine
# buildCaptures), so the argument count + kind check is exact here.
id: quality/string-instantiation
language: Java
severity: warning
message: "多余的 String 拷贝 (redundant String instantiation)"
rule:
  pattern: "new String($$$ARGS)"
xscript: |
  let args = captures.get('ARGS');
  if (args == null) {
    return;
  }
  if (args.size() == 0) {
    report({ message: '无参 new String() 是多余拷贝 (redundant no-arg String copy)' });
    return;
  }
  if (args.size() == 1) {
    let first = args.get(0);
    if (first.kind() == 'string_literal') {
      report({ message: 'new String(字面量) 是多余拷贝 (redundant literal String copy)' });
    }
  }
metadata:
  category: quality
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/nop-lint/2026-09-24-2300-1-pmd-ep-p0p1-batch.md enum #10 (PMD:StringInstantiation)"
