# roadmap item 35 (plan 2026-09-24-1400-1 enum #29, 执行期替换裁定): the
# enum's original #29 (no-empty-statement, kind: empty_statement) is NOT
# implementable on this grammar — the tree-sitter-java blob has no
# empty_statement symbol (spike-verified: the kind table lacks it), so the
# candidate pool substitutes ForLoopCanBeForeach from the design 06 §4.1
# pure-pattern table. The classic indexed-over-collection header converts to
# a foreach; array/length headers do not match (v1 face, by construction).
# The pattern carries the braced body (for_statement's body is a required
# child — a body-less pattern snippet only parses with an error-recovery
# placeholder and can never match a real loop).
id: quality/for-loop-can-be-foreach
language: Java
severity: warning
message: "此 for 循环可改写为 foreach (indexed loop over .size() can be a for-each)"
rule:
  pattern: "for (int $I = 0; $I < $COL.size(); $I++) { $$$BODY }"
metadata:
  category: quality
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/nop-lint/2026-09-24-1400-1-rule-library-48.md enum #29 替换 (design 06 §4.1 ForLoopCanBeForeach)"
