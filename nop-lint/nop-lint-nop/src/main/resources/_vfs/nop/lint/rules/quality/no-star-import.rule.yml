# design 02 §1 first-20 batch (roadmap item 29), semantics anchored to the
# wildcard-import gate of check-nop-stream-invariants.mjs (main+test 禁
# `import x.y.*;`). Spike-verified form: `import $PKG.*;` compiles and
# matches (the AST is import_declaration > scoped_identifier + asterisk).
id: quality/no-star-import
language: Java
severity: info
message: "禁止星号导入 (Wildcard import; import the concrete types)"
rule:
  any:
    - pattern: "import $PKG.*;"
    - pattern: "import static $PKG.*;"
metadata:
  category: quality
  autoFixable: false
  version: "1.0"
  source: "ai-dev/design/nop-lint/02-rule-library.md §1"
