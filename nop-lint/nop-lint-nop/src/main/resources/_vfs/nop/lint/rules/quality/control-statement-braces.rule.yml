# roadmap item 35 (plan 2026-09-24-1400-1 enum #30, 执行期候选池冻结裁定):
# frozen candidate = ControlStatementBraces from the design 06 §4.1 pure-
# pattern table (PMD alignment; the plan's #30 placeholder row points here —
# magic-number / no-dup-literal were revoked by R1 F9).
#
# Landed form: kind+xscript rather than the design table's literal pattern —
# the pattern shape `if ($$$) $STMT` would match braced bodies too (a
# metavariable unifies with any node, block included), while the AST form is
# exact: report an if whose consequence slot is NOT a block. `if (x) ;` (an
# empty-statement consequence) is a brace-less form and reports as well.
# v1 scope: the if-consequence slot only (else/loops are out of the v1 face;
# empty-block hygiene is empty-if-block's beat).
id: quality/control-statement-braces
language: Java
severity: warning
message: "if 语句体必须使用大括号 (if statement body must be wrapped in braces)"
rule:
  kind: if_statement
xscript: |
  let cons = node.child('consequence');
  if (cons == null || cons.kind() == 'block') {
    return;
  }
  report({ message: 'if 语句体未使用大括号 (if consequence is not a block)' });
metadata:
  category: quality
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/nop-lint/2026-09-24-1400-1-rule-library-48.md enum #30 (design 06 §4.1 ControlStatementBraces)"
