# xdsl-full-coverage roadmap WI2 (plan 2348) — R10 naming face.
# Transform ids must be kebab-case semantic names; transform-level
# <source>/<sink> must carry a name attribute. The description dimension is
# explicitly NOT in this warning round (roadmap v4 note). Body guard: the
# pattern matches <source> at ANY depth, and map/flatMap/filter/process
# bodies embed a function-body <source> element with neither id nor bean —
# those return silently (roughly 40-50 sites in the corpus).
# Baseline: 13 bad-id sites (8 distinct ids in the roadmap v3 note plus
# tagMap/mainSink/tagSink) + 8 unnamed endpoints = 21 node-level hits
# (the roadmap's 16 counts distinct ids + unnamed endpoints).
id: nop-xdsl-transform-naming
language: XML
severity: warning
message: "transform 命名不合规：id 须 kebab-case 语义命名，source/sink 须有 name (transform id must be kebab-case; source/sink must be named)"
rule:
  any:
    - pattern: "<source/>"
    - pattern: "<sink/>"
    - pattern: "<map/>"
    - pattern: "<flatMap/>"
    - pattern: "<filter/>"
    - pattern: "<reduce/>"
    - pattern: "<keyBy/>"
    - pattern: "<union/>"
    - pattern: "<window/>"
    - pattern: "<aggregate/>"
    - pattern: "<process/>"
    - pattern: "<cep/>"
    - pattern: "<custom/>"
    - pattern: "<sideOutput/>"
    - pattern: "<join/>"
    - pattern: "<timestampsAndWatermarks/>"
xscript: |
  if (node.ancestor('stream') == null) {
    return;
  }
  let id = node.attrValue('id');
  let bean = node.attrValue('bean');
  if (id == null && bean == null) {
    return;
  }
  let k = node.kind();
  if (id != null && !id.matches('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) {
    report({ message: 'transform id "' + id + '" 不符合 kebab-case 语义命名 (transform id violates kebab-case naming)' });
  }
  if ((k == 'source' || k == 'sink') && id != null) {
    let name = node.attrValue('name');
    if (name == null || name == '') {
      report({ message: '<' + k + ' id="' + id + '"> 缺少 name 属性 (endpoint transform missing name attribute)' });
    }
  }
metadata:
  category: nop
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/2348-wi2-xdsl-lint-l1-rules.md (xdsl roadmap WI2, R10 face)"
