# roadmap item 35 (plan 2026-09-24-1400-1 enum #11): deep-profile metrics
# rule (items 32 binding) — a method whose cyclomatic complexity (decision
# points + 1) exceeds the v1 threshold 10 is a maintenance hotspot. v1
# scope: method_declaration only; constructors are a separate kind and stay
# out of the v1 face. The threshold is a v1 constant (config externalization
# is a plan Non-Blocking Follow-up).
id: quality/method-cyclomatic-complexity
language: Java
severity: warning
message: "方法圈复杂度过高 (method cyclomatic complexity exceeds 10)"
requires: METRICS
rule:
  kind: method_declaration
xscript: |
  let c = metrics.cyclomatic(node);
  if (c > 10) {
    report({ message: '方法圈复杂度过高：cyclomatic=' + c + ' > 10 (method cyclomatic complexity ' + c + ' exceeds 10)' });
  }
metadata:
  category: quality
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/nop-lint/2026-09-24-1400-1-rule-library-48.md enum #11 (design 06 §4.1 CyclomaticComplexity)"
