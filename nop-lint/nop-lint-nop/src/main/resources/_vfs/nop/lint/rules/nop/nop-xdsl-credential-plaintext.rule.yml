# xdsl-full-coverage roadmap WI2 (plan 2348) — R7 credential face.
# Connector/endpoint credentials must be referenced as credential:{id}#{field},
# never plaintext. Fixed-candidate face adjudication: the xscript NodeWrapper
# surface has no attribute-name enumeration and no whole-tree walk (the
# TestProductionRuleCount finally-missing-close precedent), so the rule pins
# the two value-carrying element kinds (param name/defaultValue, storageConfig
# entry key/value) plus the fixed sensitive attribute names on source/sink.
# Non-candidate attribute names are the L2 (model-aware lint, WI3) residual —
# narrowing is explicit, not silent. Baseline: 0 hits.
id: nop-xdsl-credential-plaintext
language: XML
severity: warning
message: "连接器配置口令/密钥明文：必须以 credential:{id}#{field} 引用 (plaintext credential in connector config; use credential:{id}#{field})"
rule:
  any:
    - pattern: "<param/>"
    - pattern: "<entry/>"
    - pattern: "<source/>"
    - pattern: "<sink/>"
xscript: |
  if (node.ancestor('stream') == null) {
    return;
  }
  let k = node.kind();
  let nameAttr = null;
  let valueAttr = null;
  if (k == 'param') {
    nameAttr = node.attrValue('name');
    valueAttr = node.attrValue('defaultValue');
  } else if (k == 'entry') {
    nameAttr = node.attrValue('key');
    valueAttr = node.attrValue('value');
  } else {
    let names = ['password', 'secret', 'accessKey', 'secretKey', 'token'];
    for (let name of names) {
      let v = node.attrValue(name);
      if (v != null && v != '' && !v.startsWith('credential:')) {
        report({ message: '<' + k + ' ' + name + '="' + v + '"> 明文敏感值必须以 credential:{{id}}#{{field}} 引用 (plaintext sensitive attribute; use credential reference)' });
      }
    }
    return;
  }
  if (nameAttr == null || valueAttr == null || valueAttr == '') {
    return;
  }
  if (!nameAttr.matches('(?i).*(password|secret|token|accesskey|secretkey).*')) {
    return;
  }
  if (valueAttr.startsWith('credential:')) {
    return;
  }
  report({ message: nameAttr + ' 的明文值必须以 credential:{{id}}#{{field}} 引用 (plaintext credential value; use credential reference)' });
metadata:
  category: nop
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/2348-wi2-xdsl-lint-l1-rules.md (xdsl roadmap WI2, R7 face)"
