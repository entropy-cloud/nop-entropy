# xdsl-full-coverage roadmap WI2 (plan 2348) — R12 L1 static face: the
# declared-but-unconsumed surfaces of the WI1 ledger matrix (table B),
# pinned per element kind with fixed attribute/child candidates (the
# xscript NodeWrapper surface has no whole-tree walk — same adjudication as
# the R7 rule). XML nodes have no grammar field slots, so child faces use
# children(kind).size() — child(field) is always null on the XML path. Disjoint from R9 (partition/keyExpr faces) and R5
# (watermark face). Every branch here mirrors a builder fail-fast gate, so
# each roadmap release WI (WI5/WI11-WI16) must retire its branches here AND
# flip the corresponding builder nails (release three-step). Baseline: 2
# by-design negative-control fixtures (WI4 whitelists them).
id: nop-xdsl-undeclared-consumer
language: XML
severity: warning
message: "声明了无执行消费方的元素/属性（构建期将 fail-fast；随 roadmap WI5–WI16 放行逐项转正）(declared element/attribute has no execution consumer; the builder fails fast)"
rule:
  any:
    - pattern: "<streams/>"
    - pattern: "<sideInputs/>"
    - pattern: "<environments/>"
    - pattern: "<requirements/>"
    - pattern: "<checkpointParticipants/>"
    - pattern: "<coders/>"
    - pattern: "<onStart/>"
    - pattern: "<onEnd/>"
    - pattern: "<onError/>"
    - pattern: "<strategy/>"
    - pattern: "<window/>"
    - pattern: "<edge/>"
    - pattern: "<source/>"
    - pattern: "<sink/>"
    - pattern: "<custom/>"
xscript: |
  if (node.ancestor('stream') == null) {
    return;
  }
  let k = node.kind();
  if (k == 'streams' || k == 'sideInputs' || k == 'environments'
      || k == 'requirements' || k == 'checkpointParticipants' || k == 'coders') {
    report({ message: '<' + k + '> 注册表无执行消费方（构建期 fail-fast；roadmap WI11/WI12 放行面）(registry has no execution consumer)' });
    return;
  }
  if (k == 'onStart' || k == 'onEnd' || k == 'onError') {
    report({ message: '<' + k + '> 生命周期回调无消费方（roadmap WI13 放行面）(lifecycle callback has no consumer)' });
    return;
  }
  if (k == 'strategy') {
    // WI5 (plan 2351): triggerId released — no longer an unconsumed face here.
    if (node.attrValue('accumulationMode') == 'ACCUMULATING_AND_RETRACTING') {
      report({ message: 'ACCUMULATING_AND_RETRACTING 无消费方（spec-only，D10）(accumulation mode has no consumer)' });
    }
    return;
  }
  if (k == 'window') {
    if (node.attrValue('parallelism') != null) {
      report({ message: '<window> 是虚拟元素，parallelism 无消费方（应在聚合/规约节点声明）(window parallelism has no consumer)' });
    }
    // WI5 (plan 2351): node-level triggerId released — no longer an unconsumed face.
    return;
  }
  if (k == 'edge') {
    let flowAttrs = ['flowControlPolicy', 'queueCapacity', 'receiveWindow', 'packetSize'];
    for (let i = 0; i < flowAttrs.size(); i++) {
      if (node.attrValue(flowAttrs[i]) != null) {
        report({ message: '边属性 ' + flowAttrs[i] + ' 在该边上无执行载体（WI14 裁定：声明式接线延后至引擎级 successor）(edge attribute has no execution carrier: deferred to an engine-level successor)' });
      }
    }
    return;
  }
  if (k == 'source' || k == 'sink') {
    if (node.children('params').size() > 0) {
      report({ message: '<' + k + '> <params> 无执行消费方（roadmap WI15 放行面）(endpoint params have no consumer)' });
    }
    if (k == 'source' && node.children('outputType').size() > 0) {
      report({ message: '<source> <outputType> 无执行消费方（roadmap WI15 放行面）(source outputType has no consumer)' });
    }
    if (k == 'sink' && node.children('inputType').size() > 0) {
      report({ message: '<sink> <inputType> 无执行消费方（roadmap WI15 放行面）(sink inputType has no consumer)' });
    }
    let maxp = node.attrValue('maxParallelism');
    if (maxp != null && maxp != '0' && maxp != '') {
      report({ message: '<' + k + '> maxParallelism 无执行消费方（roadmap WI15 放行面）(endpoint maxParallelism has no consumer)' });
    }
    let cap = node.attrValue('consistencyCapability');
    if (cap != null && cap != '' && cap != 'AT_LEAST_ONCE') {
      report({ message: '<' + k + '> consistencyCapability 无执行消费方（roadmap WI15 放行面）(endpoint consistencyCapability has no consumer)' });
    }
    return;
  }
  if (k == 'custom') {
    if (node.children('params').size() > 0 || node.children('source').size() > 0) {
      report({ message: '<custom> 的 <params>/<source> 体无消费方（roadmap WI15 放行面）(custom params/body have no consumer)' });
    }
  }
metadata:
  category: nop
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/2348-wi2-xdsl-lint-l1-rules.md (xdsl roadmap WI2, R12 L1 face)"
