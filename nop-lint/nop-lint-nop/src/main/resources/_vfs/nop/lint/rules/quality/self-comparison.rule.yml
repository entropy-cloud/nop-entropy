# roadmap item 36 (plan 2026-09-24-2300-1 enum #4, manifest credit
# EP:SelfComparison): x.compareTo(x) is always zero — the comparison cannot
# order anything and hides a typo for the intended second operand. Same-name
# metavariable binding as no-self-compare (enum #2).
id: quality/self-comparison
language: Java
severity: warning
message: "compareTo 自比较恒为 0 (self-comparison; compareTo on the same expression)"
rule:
  pattern: "$X.compareTo($X)"
metadata:
  category: quality
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/nop-lint/2026-09-24-2300-1-pmd-ep-p0p1-batch.md enum #4 (EP:SelfComparison)"
