# roadmap item 35 (plan 2026-09-24-1400-1 enum #3, R1 修正形态): double-brace
# initialization `new X() {{ ... }}` allocates an anonymous subclass that
# holds a reference to the enclosing instance (leak) and relies on a grammar
# quirk. tree-sitter-java has no instance_initializer kind, so the landed
# form is the R1-adjudicated structural judgment: an object_creation_expr
# whose class_body carries no method member is a double-brace literal body —
# a real anonymous class always declares its functional/override methods.
id: antipattern/double-brace-init
language: Java
severity: warning
message: "禁止双括号初始化，匿名子类持有外部实例引用 (Double-brace initialization creates a leak-prone anonymous subclass; build the collection plainly)"
rule:
  kind: object_creation_expr
xscript: |
  let body = node.child('body');
  if (body == null) {
    return;
  }
  if (body.children('method_declaration').size() > 0) {
    return;
  }
  report({ message: '双括号初始化：' + node.child('type').text() + ' 匿名子类持有外部实例引用 (double-brace initialization on ' + node.child('type').text() + ')' });
metadata:
  category: antipattern
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/nop-lint/2026-09-24-1400-1-rule-library-48.md enum #3 (design 06 §4.1 DoubleBraceInitialization)"
