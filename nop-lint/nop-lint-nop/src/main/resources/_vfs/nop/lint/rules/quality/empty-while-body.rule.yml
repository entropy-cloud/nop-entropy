# roadmap item 35 (plan 2026-09-24-1400-1 enum #28): an empty while body is
# either a busy-wait or dead code. Same kind+xscript emptiness shape as
# empty-if-block (#6): body must be a block with no named children (a
# comment-only body stays silent). The `while (c);` empty-statement variant
# is out of the v1 scope per the plan enum.
id: quality/empty-while-body
language: Java
severity: warning
message: "while 空循环体：忙等或死代码 (Empty while body; busy-wait or dead code)"
rule:
  kind: while_statement
xscript: |
  let body = node.child('body');
  if (body == null || body.kind() != 'block') {
    return;
  }
  if (body.children().size() > 0) {
    return;
  }
  report({ message: 'while 空循环体 (empty while body)' });
metadata:
  category: quality
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/nop-lint/2026-09-24-1400-1-rule-library-48.md enum #28"
