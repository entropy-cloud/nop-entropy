# xdsl-full-coverage roadmap WI2 (plan 2348) — R9 L1 static face (single-
# element decidable sub-faces only). The graph-level faces (HASH edge into
# keyBy/union/join) need a topology walk and stay with the L2 lint (WI3) and
# the builder's validateEdgeDeclarations, which remains the final gate — L1
# is earlier locating only, never a second semantic (roadmap R9 row).
# Adjudication: REBALANCE/BROADCAST report on declaration — the builder
# typed-rejects both values unconditionally (no DSL consumer mechanism
# exists), so "declared" and "no consumer" coincide on this face.
id: nop-xdsl-edge-partition
language: XML
severity: warning
message: "边分区声明不满足静态约束：HASH 缺 keyExpr / 非 HASH 带 keyExpr / REBALANCE·BROADCAST 无消费面 (edge partition declaration violates the static contract)"
rule:
  pattern: "<edge/>"
xscript: |
  if (node.ancestor('stream') == null) {
    return;
  }
  let p = node.attrValue('partition');
  let key = node.attrValue('keyExpr');
  if (p == 'REBALANCE' || p == 'BROADCAST') {
    report({ message: '边 partition=' + p + ' 在 XDSL 无执行消费面（构建期恒拒绝）(edge partition ' + p + ' has no DSL consumer; the builder rejects it)' });
    return;
  }
  if (p == 'HASH' && (key == null || key == '')) {
    report({ message: 'HASH 边缺少 keyExpr (HASH edge requires keyExpr)' });
    return;
  }
  if ((p == null || p != 'HASH') && key != null && key != '') {
    report({ message: '非 HASH 边声明了 keyExpr（仅 HASH 边可带 keyExpr；未声明 partition 视为 FORWARD 默认值）(keyExpr on a non-HASH edge; absent partition defaults to FORWARD)' });
  }
metadata:
  category: nop
  autoFixable: false
  version: "1.0"
  source: "ai-dev/plans/2348-wi2-xdsl-lint-l1-rules.md (xdsl roadmap WI2, R9 L1 face)"
