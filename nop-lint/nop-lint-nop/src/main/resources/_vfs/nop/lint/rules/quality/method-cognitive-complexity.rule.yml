# roadmap item 35 (plan 2026-09-24-1400-1 enum #12): deep-profile metrics
# rule (items 32 binding) — SonarSource-style cognitive complexity (nesting
# increments) over the v1 threshold 15. Same v1 scope as the cyclomatic
# rule: method_declaration only, threshold is a v1 constant.
id: quality/method-cognitive-complexity
language: Java
severity: warning
message: "方法认知复杂度过高 (method cognitive complexity exceeds 15)"
requires: METRICS
rule:
  kind: method_declaration
xscript: |
  let c = metrics.cognitive(node);
  if (c > 15) {
    report({ message: '方法认知复杂度过高：cognitive=' + c + ' > 15 (method cognitive complexity ' + c + ' exceeds 15)' });
  }
metadata:
