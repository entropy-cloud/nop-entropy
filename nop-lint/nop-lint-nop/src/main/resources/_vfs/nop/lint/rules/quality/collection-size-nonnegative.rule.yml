# roadmap item 36 (plan 2026-09-24-2300-1 enum #6, manifest credit
# EP:SizeGreaterThanOrEqualsZero): size() can never be negative, so
# `size() >= 0` is always true — usually a typo for `> 0` or a leftover
# bounds check. Pattern-only.
id: quality/collection-size-nonnegative
language: Java
severity: warning
message: "size() >= 0 恒为 true (collection size is never negative)"
rule:
  pattern: "$COL.size() >= 0"
metadata:
  category: quality
  autoFixable: false
  version: "1.0"
