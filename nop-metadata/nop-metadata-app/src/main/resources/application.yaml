
nop:
  debug: false
  auth:
    jwt:
      # Set via environment variable NOP_AUTH_JWT_ENC_KEY in production
      enc-key: change-me-in-production

    login:
      allow-create-default-user: true # 如果用户表为空，则自动创建缺省账户nop, 密码nop-test

    site-map:
      static-config-path: /nop/metadata/auth/app.action-auth.xml
      cache-timeout: 1s
      support-debug: true

    data-auth-config-path: /nop/metadata/auth/app.data-auth.xml

  web:
    validate-page-model: true

  orm:
    init-database-schema: true

  datasource:
    driver-class-name: org.h2.Driver
    jdbc-url: jdbc:h2:./db/test
    username: sa
    password:
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    jdbc-url: jdbc:mysql://127.0.0.1:3306/dev?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=UTC
#    username: nop
#    password: nop-test

  graphql:
    schema-introspection:
      enabled: false

# devservices 会启用testcontainers来管理测试数据库
quarkus:
  dev:
    watch:
      enabled: false

  live-reload:
    enabled: false

  devservices:
    enabled: false

  datasource:
    # classpath 上同时存在 quarkus-jdbc-h2 与 quarkus-jdbc-mysql（mysql 为生产可切换项），
    # Quarkus 要求显式声明 db-kind 才能构建默认 datasource（plan 2450 Gate A 首次编译暴露）
    db-kind: h2
    devservices:
      enabled: false

  smallrye-graphql:
    ui:
      always-include: true

  http:
    host: 0.0.0.0
    cors: true

  log:
    level: INFO

    category:
      "io.nop":
        level: INFO

---
"%prod":
  nop:
    graphql:
      schema-introspection:
        enabled: false
