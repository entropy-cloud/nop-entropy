# Flux 版本：AMS 的 button-toolbar 渲染器在 Flux 中不存在，改用 flex + button 组合承载。
type: page
body:
  type: flex
  gap: 8
  body:
    - type: button
      label: "testValidate?valid"
      onClick:
        action: ajax
        args: { url: "/r/Demo__testValidate?orderId=1&materialId=2", method: post }
        messages: { success: "成功了！欧耶", failed: "失败了呢。。" }
    - type: button
      variant: primary
      label: "testValidate?invalid"
      onClick:
        action: ajax
        args: { url: "/r/Demo__testValidate?orderId=1&materialId=3", method: post }
    - type: button
      label: "testValidate2?valid"
      onClick:
        action: ajax
        args: { url: "/r/Demo__testValidate2?orderId=1&materialId=2", method: post }
        messages: { success: "成功了！欧耶", failed: "失败了呢。。" }
    - type: button
      variant: secondary
      label: "testValidate?invalid"
      onClick:
        action: ajax
        args: { url: "/r/Demo__testValidate2?orderId=1&materialId=3", method: post }
    - type: button
      variant: success
      label: "testValidate3?valid"
      onClick:
        action: ajax
        args: { url: "/r/Demo__testValidate?orderId=1&materialId=2", method: post }
        messages: { success: "成功了！欧耶", failed: "失败了呢。。" }
    - type: button
      variant: warning
      label: "testValidate3?invalid"
      onClick:
        action: ajax
        args: { url: "/r/Demo__testValidate?orderId=1&materialId=3", method: post }
