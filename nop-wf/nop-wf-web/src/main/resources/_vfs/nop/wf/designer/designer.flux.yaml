# Flux 版本的工作流设计器页。
#
# 设计契约 ai-dev/design/nop-wf/workflow-designer-integration.md §3.5：
# - 页面只装配 dynamic-renderer + spinner fallback，所有领域 schema 由服务端返回
#   （designer-page schema：type/config/document/toolbar），保证"页面可变、契约稳定"。
# - loadAction 经 ajax 调用 WorkflowDesignerService__loadDesignerPage，wfDefId 由
#   NopWfDefinition.view.xml 的 design 行操作 drawer 传入（drawer.data）。
# - 保存按钮、撤销/重做/网格开关等工具栏装配在服务端返回的 page 级 toolbar region
#   （非 DesignerConfig.toolbar —— 内置工具栏仅支持单命名 action，无 then 链）。
type: page
title: "@i18n:common.flowDesigner"
bodyClassName: flex overflow-auto
body:
  - type: dynamic-renderer
    name: wf-designer-renderer
    loadAction:
      action: ajax
      args:
        url: "/r/WorkflowDesignerService__loadDesignerPage"
        method: GET
        data:
          wfDefId: "${wfDefId}"
    body:
      - type: spinner
        message: "@i18n:common.loading | 加载中"
