<div id="xpt-report">
<style>
#xpt-report .xpt-hidden{ display:none}
#xpt-report .xpt-table{
   border-collapse:collapse;border-spacing:0;table-layout:fixed;
}
#xpt-report .xpt-row{ line-height:normal;}
#xpt-report .xpt-cell-num{ text-align:right; }
#xpt-report .xpt-cell{
   word-wrap:break-word;word-break:break-all;padding:2px;box-sizing:border-box;
}
#xpt-report .xpt-s-0{
vertical-align:middle;
font-family:"等线",sans-serif;
font-size:11pt;
color:rgba(0,0,0,1.0);
border:none;}
#xpt-report .xpt-s-1{
vertical-align:top;
text-align:left;
font-family:"等线",sans-serif;
font-size:11pt;
color:rgba(0,0,0,1.0);
white-space:normal;
border:none;}
</style>
<div id="xpt-report-sheet-1" data-sheet-name="Sheet2">
<style>
#xpt-report-sheet-1{overflow-x:auto;}
@media (max-width:768px){
#xpt-report-sheet-1 .xpt-cell{font-size:12px;padding:1px;}
}
</style>
<table  class="xpt-table">
<colgroup><col  style="width:55.25pt" /><col  style="width:55.25pt" /><col  style="width:55.25pt" /></colgroup>
<thead>
</thead>
<tbody>
<tr  class="xpt-row" style="height:14.0pt" data-expand-group="row-0"><td  class="xpt-cell">1</td><td  class="xpt-cell">a1</td><td  class="xpt-cell-num xpt-cell">1</td></tr>
<tr  class="xpt-row" style="height:14.0pt" data-expand-group="row-1"><td  class="xpt-cell">2</td><td  class="xpt-cell">a2</td><td  class="xpt-cell-num xpt-cell">2</td></tr>
</tbody>
<tfoot></tfoot>
</table>
<script>
(function(){
if(window.__xptInteractive) return; window.__xptInteractive=true;
document.addEventListener('click',function(ev){
  var th=ev.target.closest('th');
  if(th && th.parentElement && th.parentElement.parentElement && th.parentElement.parentElement.tagName==='THEAD'){
    var table=th.closest('table'); var tbody=table.querySelector('tbody'); if(!tbody) return;
    var idx=th.cellIndex;
    var rows=[].slice.call(tbody.querySelectorAll('tr'));
    function val(tr){ var td=tr.children[idx]; return td? td.textContent.trim():''; }
    function cmp(a,b){ var na=parseFloat(val(a)),nb=parseFloat(val(b));
      if(!isNaN(na)&&!isNaN(nb)) return na-nb; return val(a).localeCompare(val(b)); }
    rows.sort(cmp); rows.forEach(function(r){tbody.appendChild(r);});
    return;
  }
  var toggle=ev.target.closest('tr[data-expand-toggle]');
  if(toggle){
    var group=toggle.getAttribute('data-expand-group');
    var expanded=toggle.getAttribute('aria-expanded')!=='false';
    toggle.setAttribute('aria-expanded', expanded?'false':'true');
    document.querySelectorAll('tr[data-expand-group="'+group+'"]').forEach(function(r){
      if(r!==toggle) r.style.display=expanded?'none':'';
    });
  }
});
})();
</script>
</div>
</div>
