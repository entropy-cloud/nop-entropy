# Flux 版本：amis service → data-source（结果以 data-source name 发布，兄弟节点消费）；
# form target 机制 → 按钮 onClick refreshSource；tpl → text。
type: page
body:
  # data-source 自身不渲染，结果以 name 发布给兄弟节点消费；when 只挂在 data-source
  # 上，查询条件未填时不发请求（见 flux-guide/design-patterns/data-source.md）。
  - type: data-source
    name: reportService
    action: ajax
    args:
      url: "@query:ReportDemo__renderHtml?reportName=${reportName}"
      method: get
      data:
        data:
          title: "${title}"
    when: "${title}"

  - type: form
    id: queryForm
    title: 查询条件
    mode: horizontal
    body:
      - type: hidden
        name: reportName
        value: /ext/report-with-params.xpt.xlsx
      - type: input-text
        name: title
        required: true
        label: 标题
      - type: button
        label: 查询
        variant: primary
        onClick:
          action: refreshSource
          targetId: reportService

  # amis 的 tpl:'${reportHtml|raw}' 在 flux 对应 html 渲染器（报告站内 HTML 属可信内容）
  - type: html
    content: "${reportService}"
    sanitize: false
