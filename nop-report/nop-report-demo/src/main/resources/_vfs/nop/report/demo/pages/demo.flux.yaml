# Flux 版本：asideResizor → asideResizable；amis 页面级 toolbar → flux page 的 header 槽位
# （flux 无 toolbar region）；actionType download → flux 原生 download 动作；reload → refreshSource；
# service → data-source；tpl → html。
type: page
aside:
  - type: input-tree
    name: tree
    source: /r/ReportDemo__getDemoReports
    rootLabel: 报表示例
    value: ''
    unfold: true
    multiple: false
    draggable: false
    highlight: true
    hideRoot: false
    rootCreatable: false
    rootLevel: 1
    labelField: label
    valueField: value
    childrenField: children
asideResizable: true
asideClassName: w-64
header:
  - type: button
    variant: primary
    label: 下载报表模型
    onClick:
      action: download
      args:
        api:
          url: "/p/ReportDemo__downloadModel?reportName=${tree}"
          method: get
          responseType: blob
  - type: button
    variant: primary
    label: 导出Excel
    onClick:
      action: download
      args:
        api:
          url: "/p/ReportDemo__download?reportName=${tree}&renderType=xlsx"
          method: get
          responseType: blob
  - type: button
    variant: primary
    label: 更新显示
    onClick:
      action: refreshSource
      targetId: reportService
body:
  # data-source 自身不渲染，结果以 name 发布给兄弟节点消费；when 只挂在 data-source
  # 上，未选报表时不发请求（见 flux-guide/design-patterns/data-source.md）。
  # 参数显式写在 data 里；不要写 method: get —— 宿主 http.ts 以页面上的 method 覆盖
  # resolver 强制的 POST，GET 不带 body，会把 reportName 丢掉（后端报 field-null-arg）。
  - type: data-source
    name: reportService
    action: ajax
    args:
      url: "@query:ReportDemo__renderHtml"
      data:
        reportName: "${tree}"
    when: "${tree}"
  # amis 的 tpl:'${reportHtml|raw}' 在 flux 对应 html 渲染器（报告站内 HTML 属可信内容）
  - type: html
    content: "${reportService}"
    sanitize: false
