# Flux 版本：asideResizor → asideResizable；toolbar 的 amis actionType download/reload → onClick ajax(blob)/refreshSource；
# service → data-source；tpl → text。
type: page
aside:
  - type: input-tree
    name: tree
    source: /r/ReportDemo__getDemoReports
    rootLabel: 报表示例
    value: ''
    unfold: true
    multiple: false
    draggable: false
    highlight: true
    hideRoot: false
    rootCreatable: false
    rootLevel: 1
    labelField: label
    valueField: value
    childrenField: children
asideResizable: true
asideClassName: w-64
toolbar:
  - type: button
    variant: primary
    label: 下载报表模型
    onClick:
      action: ajax
      args:
        url: "/p/ReportDemo__downloadModel?reportName=${tree}"
        method: get
        responseType: blob
  - type: button
    variant: primary
    label: 导出Excel
    onClick:
      action: ajax
      args:
        url: "/p/ReportDemo__download?reportName=${tree}&renderType=xlsx"
        method: get
        responseType: blob
  - type: button
    variant: primary
    label: 更新显示
    onClick:
      action: refreshSource
      targetId: reportService
body:
  - type: data-source
    name: reportService
    action: ajax
    args:
      url: "@query:ReportDemo__renderHtml?reportName=${tree}"
      method: get
      data: {}
    when: "${tree}"
  - type: text
    name: html
    text: "${reportService|raw}"
